[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "crink-network"
version = "0.1.0"
description = "Event-coded network dataset of ties among China, Russia, Iran and North Korea"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT (code); CC BY 4.0 (data)" }
dependencies = [
  "pandas>=2.0",
  "networkx>=3.1",
  "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.4"]

[project.scripts]
crink = "crink.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
